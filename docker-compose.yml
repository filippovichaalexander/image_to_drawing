services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_FULL_AI: "${INSTALL_FULL_AI:-1}"
    image: image_to_drawing:latest
    container_name: image_to_drawing_web
    ports:
      - "${PORT:-8000}:8000"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - UPLOAD_DIR=/app/data/uploads
      - RESULTS_DIR=/app/data/results
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
      - AI_MODE=${AI_MODE:-full}
      - YOLO_CONFIG_DIR=/app/.ultralytics
      - HOME=/app/data
      - PADDLEOCR_HOME=/app/data/.paddleocr
      - MPLCONFIGDIR=/app/data/.matplotlib
    volumes:
      - ./app:/app/app:ro
      - ./data/uploads:/app/data/uploads
      - ./data/results:/app/data/results
      # Host models/ overrides image weights when present (run scripts/download_models.py)
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
